version: 2
updates:
  # npm dependencies, resolved from package.json + pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain caution).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # The types must match the oldest supported runtime (engines: node >=24); a newer major would let code use
      # APIs that Node 24 does not have. Raise it together with `engines` and `.mise.toml`.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope
